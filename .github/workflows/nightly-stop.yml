name: Nightly cost control

on:
  schedule:
    - cron: '10 15 * * *' # TEMPORARY test slot — the real one is 0 18 * * * (18:00 UTC); cron is ALWAYS UTC
  workflow_dispatch: # manual trigger for testing right now

permissions:
  id-token: write # OIDC — same passwordless login as the deploy workflow
  contents: read

env:
  RESOURCE_GROUP: rg-cloud26-${{ vars.YOUR_NAME }}-dev
  PG_SERVER: pg-cloud26-${{ vars.YOUR_NAME }}-dev

jobs:
  stop-database:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Stop PostgreSQL if it is running
        run: |
          state=$(az postgres flexible-server show             --resource-group "$RESOURCE_GROUP"             --name "$PG_SERVER"             --query state --output tsv)
          echo "Server state: $state"
          if [ "$state" = "Ready" ]; then
            az postgres flexible-server stop               --resource-group "$RESOURCE_GROUP"               --name "$PG_SERVER"
            echo "Database stopped. Compute billing ends here; storage still bills."
          else
            echo "Not in 'Ready' state — nothing to stop."
          fi
